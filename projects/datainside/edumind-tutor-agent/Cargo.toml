[package]
name = "edumind-tutor-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "edumind-tutor-agent"
path = "src/main.rs"

[dependencies]
harness-core       = { workspace = true }
harness-loop       = { workspace = true }
harness-models     = { workspace = true }
harness-hooks      = { workspace = true }
harness-context    = { workspace = true }
harness-mcp-client = { workspace = true }
harness-cortexdb   = { workspace = true }
harness-serve      = { workspace = true, features = ["http", "cors"] }
bi-common          = { path = "../bi-common" }
axum               = "0.8"
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow             = { workspace = true }
