<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI 战略顾问 · 直连你的数据库</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --fg:#1a1d24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"PingFang SC",Segoe UI,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header .logo { width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header .sub { color:var(--muted); font-size:12px; }
  header .conn { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  header .conn .dot { width:8px;height:8px;border-radius:50%;background:var(--ok); }
  .new-chat { border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12px; }
  .new-chat:hover { background:#f1f3f5; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 120px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { font-size:13px; border:1px solid var(--line); background:var(--panel); color:var(--accent); border-radius:20px; padding:6px 14px; cursor:pointer; }
  .chip:hover { background:#eff6ff; }
  .msg { margin:14px 0; }
  .msg.user { text-align:right; }
  .msg.user .b { display:inline-block; background:var(--accent); color:#fff; border-radius:14px 14px 4px 14px; padding:8px 14px; max-width:80%; text-align:left; }
  .msg.ai .b { background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:6px 20px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .msg.ai table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  .msg.ai th,.msg.ai td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
  .msg.ai th { background:#f1f3f5; }
  .msg.ai tr:nth-child(even) td { background:#fafbfc; }
  .status { font-size:12px; color:var(--muted); margin:6px 2px; min-height:16px; }
  .status .ok { color:var(--ok); }
  .composer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 16px; }
  .composer .wrap { max-width:860px; margin:0 auto; display:flex; gap:10px; }
  textarea { flex:1; font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px 12px; resize:none; min-height:44px; max-height:140px; }
  button.send { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 20px; font-weight:650; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  .foot { text-align:center; color:var(--muted); font-size:11px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div><h1>AI 战略顾问</h1><div class="sub">直连你的数据库 · 本地模型 · 数据不出机器</div></div>
  <div class="conn"><span class="dot"></span><span id="conn">已连接数据库(只读)</span></div>
  <button class="new-chat" id="newChat" type="button">新对话</button>
</header>
<main>
  <div class="chips" id="chips">
    <span class="chip">哪些门店在亏损?为什么?给整改建议</span>
    <span class="chip">生鲜品类的损耗率有多高?对利润影响多大?</span>
    <span class="chip">各业态(大卖场/标超/便利店)的盈利能力对比</span>
    <span class="chip">2025 年营收同比 2024 年怎么样?</span>
  </div>
  <div id="messages"></div>
</main>
<div class="composer">
  <div class="wrap">
    <textarea id="q" placeholder="问一个经营/战略问题,顾问会直接查你的库来回答…"></textarea>
    <button class="send" id="send">分析</button>
  </div>
  <div class="foot">只读连接 · 只允许 SELECT · 每次查询 hash 链审计留痕 · 数字全部来自你的库,不编造</div>
</div>

<script type="module">
import { createRenderer, chart } from "./vendor/aigui-bundle.js?v=1"
const $ = id => document.getElementById(id)
const msgs = $("messages"), qBox = $("q"), sendBtn = $("send")
const newSessionId = () => `web-${crypto.randomUUID()}`
let sessionId = sessionStorage.getItem("advisor-session") || newSessionId()
sessionStorage.setItem("advisor-session", sessionId)

// 模型 badge
fetch("/model").then(r=>r.ok&&r.json()).then(d=>{ if(d) $("conn").textContent = `已连库(只读) · 模型 ${d.model}` }).catch(()=>{})

$("chips").addEventListener("click", e => { const c=e.target.closest(".chip"); if(c){ qBox.value=c.textContent; ask() } })
sendBtn.addEventListener("click", ask)
qBox.addEventListener("keydown", e => { if((e.metaKey||e.ctrlKey)&&e.key==="Enter") ask() })
$("newChat").addEventListener("click", () => {
  sessionId = newSessionId()
  sessionStorage.setItem("advisor-session", sessionId)
  msgs.replaceChildren()
  qBox.focus()
})

function addMsg(cls) { const d=document.createElement("div"); d.className="msg "+cls; const b=document.createElement("div"); b.className="b"; d.appendChild(b); msgs.appendChild(d); window.scrollTo(0,document.body.scrollHeight); return b }

async function ask() {
  const message = qBox.value.trim(); if (!message) return
  qBox.value = ""; sendBtn.disabled = true
  addMsg("user").textContent = message
  const aiBox = addMsg("ai")
  const status = document.createElement("div"); status.className="status"; aiBox.appendChild(status)
  const answerEl = document.createElement("div"); aiBox.appendChild(answerEl)
  const renderer = createRenderer(answerEl, { plugins:[chart({interactive:true})] })
  const t0 = performance.now()
  let answer = "", chartsRendered = 0
  const chartCount = () => (answer.match(/```chart[\s\S]*?```/g)||[]).length
  try {
    const res = await fetch("/chat/stream", { method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer x" },
      body: JSON.stringify({ session_id:sessionId, message }) })
    if (!res.ok) throw new Error("HTTP "+res.status)
     if (!res.body) throw new Error("服务器未返回响应流")
     const reader = res.body.getReader(), dec = new TextDecoder()
     let buf = ""
     let completed = false
    for(;;){ const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true})
      let nl; while((nl=buf.indexOf("\n"))!==-1){ const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1)
        if(!line.startsWith("data:"))continue; const p=line.slice(5).trim(); if(!p)continue
        let f; try{f=JSON.parse(p)}catch{continue}
        const ms=((performance.now()-t0)/1000).toFixed(1)
        if(f.type==="step"){ status.innerHTML = `⋯ ${f.label} · ${ms}s` }
        else if(f.type==="token"){ answer+=f.text; const n=chartCount(); if(n>chartsRendered){chartsRendered=n;renderer.reset();renderer.push(answer)} else renderer.push(f.text) }
        else if(f.type==="done"){ completed=true; const fin=f.answer??answer; const fn=(fin.match(/```chart[\s\S]*?```/g)||[]).length
           if(fn>chartsRendered||(fn===0&&chartsRendered===0)){renderer.reset();renderer.push(fin)}; answer=fin
           status.innerHTML = `<span class="ok">✔ 完成</span> · ${ms}s · 已查库 · 审计留痕` }
     }
     if (!completed) throw new Error("响应流意外中断,请重试")
      window.scrollTo(0,document.body.scrollHeight)
    }
  } catch(e){ status.innerHTML = `<span style="color:#dc2626">✖ ${e.message}</span>` }
  finally { sendBtn.disabled = false }
}
</script>
</body>
</html>
