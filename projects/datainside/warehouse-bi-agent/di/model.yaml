# Semantic model for a warehouse / WMS operator. Flow grain (outbound order
# lines) vs snapshot grain (daily on-hand): inventory_turnover is the classic
# chasm — each base metric aggregates in its own CTE. revenue / cost /
# gross_margin are finance-gated; customer phone is masked.

entities:
  - {name: warehouse, table: warehouses,        primary_key: warehouse_id}
  - {name: sku,       table: skus,              primary_key: sku_id}
  - {name: inbound,   table: inbound_lines,     primary_key: inbound_id}
  - {name: order,     table: orders,            primary_key: order_id}
  - {name: line,      table: order_lines,       primary_key: line_id}
  - {name: snapshot,  table: inventory_snapshot, primary_key: snap_id}
  - {name: pick,      table: pick_tasks,        primary_key: pick_id}

joins:
  - {from: line,     to: order,     from_key: order_id,     to_key: order_id,     cardinality: many_to_one}
  - {from: line,     to: warehouse, from_key: warehouse_id, to_key: warehouse_id, cardinality: many_to_one}
  - {from: line,     to: sku,       from_key: sku_id,       to_key: sku_id,       cardinality: many_to_one}
  - {from: order,    to: warehouse, from_key: warehouse_id, to_key: warehouse_id, cardinality: many_to_one}
  - {from: inbound,  to: warehouse, from_key: warehouse_id, to_key: warehouse_id, cardinality: many_to_one}
  - {from: inbound,  to: sku,       from_key: sku_id,       to_key: sku_id,       cardinality: many_to_one}
  - {from: snapshot, to: warehouse, from_key: warehouse_id, to_key: warehouse_id, cardinality: many_to_one}
  - {from: snapshot, to: sku,       from_key: sku_id,       to_key: sku_id,       cardinality: many_to_one}
  - {from: pick,     to: warehouse, from_key: warehouse_id, to_key: warehouse_id, cardinality: many_to_one}
  - {from: pick,     to: order,     from_key: order_id,     to_key: order_id,     cardinality: many_to_one}

dimensions:
  - {name: warehouse_name, entity: warehouse, column: name,     type: categorical, synonyms: [仓库, 仓, 中心仓]}
  - {name: region,         entity: warehouse, column: region,   type: categorical, synonyms: [大区, 区域]}  # RLS key
  - {name: city,           entity: warehouse, column: city,     type: categorical, synonyms: [城市]}
  - {name: sku_category,   entity: sku,       column: category, type: categorical, synonyms: [品类, 类目, 商品类别]}
  - {name: line_status,    entity: line,      column: status,   type: categorical, synonyms: [发货状态, 订单行状态]}
  - {name: customer_phone, entity: order,     column: contact_phone, type: categorical, mask: "'***'"}  # PII
  - {name: ship_time,      entity: line,      column: shipped_at, type: time}

metrics:
  - name: shipped_qty
    description: "Units shipped (outbound flow grain)."
    synonyms: [出库量, 发货量, 出货件数]
    entity: line
    agg: sum
    expr: "case when status='shipped' then shipped_qty else 0 end"
  - name: ordered_qty
    description: "Units ordered (order-line grain)."
    synonyms: [订购量, 下单量]
    entity: line
    agg: sum
    expr: "ordered_qty"
  - name: revenue
    description: "Outbound revenue, shipped only (RMB)."
    synonyms: [营收, 销售额, 出库金额]
    entity: line
    agg: sum
    expr: "case when status='shipped' then revenue_amount else 0 end"
    roles: [finance, admin]
  - name: cost
    description: "Cost of goods shipped (RMB)."
    synonyms: [成本, 货物成本]
    entity: line
    agg: sum
    expr: "case when status='shipped' then cost_amount else 0 end"
    roles: [finance, admin]
  - name: avg_on_hand
    description: "Average on-hand units (snapshot grain)."
    synonyms: [平均在库, 平均库存]
    entity: snapshot
    agg: avg
    expr: "on_hand_qty"
  - name: picks_count
    description: "Pick tasks."
    synonyms: [拣货任务数, 拣货单数]
    entity: pick
    agg: count
    expr: "pick_id"
  - name: on_time_picks
    description: "Pick tasks completed within SLA."
    synonyms: [准时拣货数]
    entity: pick
    agg: sum
    expr: "on_time"
  - {name: inbound_qty, description: "Units received (putaway).", synonyms: [入库量, 收货量], entity: inbound, agg: sum, expr: "case when status='putaway_done' then qty else 0 end"}

  - name: fill_rate
    description: "Shipped over ordered units (order-line grain)."
    synonyms: [订单满足率, 履约率, 齐套率]
    formula: "shipped_qty::numeric / nullif(ordered_qty, 0)"
    additivity: non_additive
  - name: inventory_turnover
    description: "Shipped units over average on-hand. Flow grain vs snapshot grain."
    synonyms: [库存周转, 周转率, 周转次数]
    formula: "shipped_qty::numeric / nullif(avg_on_hand, 0)"
    additivity: non_additive
  - name: pick_on_time_rate
    description: "On-time picks over all picks (pick grain)."
    synonyms: [拣货准时率, 准时率]
    formula: "on_time_picks::numeric / nullif(picks_count, 0)"
    additivity: non_additive
  - name: gross_margin
    description: "(revenue - cost) / revenue."
    synonyms: [毛利率, 毛利]
    formula: "(revenue - cost)::numeric / nullif(revenue, 0)"
    additivity: non_additive
    roles: [finance, admin]
