# Semantic model for a 连锁药店. sales grain vs inventory grain, so sell_through
# is chasm-safe. revenue / gross_margin / margin_rate are finance-gated; member
# phone is masked. Pharmacy specifics: 处方/OTC split and 近效期 (near-expiry) stock.

entities:
  - {name: store,     table: stores,    primary_key: store_id}
  - {name: drug,      table: drugs,     primary_key: sku}
  - {name: member,    table: members,   primary_key: member_id}
  - {name: inventory, table: inventory, primary_key: inv_id}
  - {name: sale,      table: sales,     primary_key: sale_id}

joins:
  - {from: sale,      to: drug,   from_key: sku,       to_key: sku,       cardinality: many_to_one}
  - {from: sale,      to: member, from_key: member_id, to_key: member_id, cardinality: many_to_one}
  - {from: sale,      to: store,  from_key: store_id,  to_key: store_id,  cardinality: many_to_one}
  - {from: inventory, to: drug,   from_key: sku,       to_key: sku,       cardinality: many_to_one}
  - {from: inventory, to: store,  from_key: store_id,  to_key: store_id,  cardinality: many_to_one}

dimensions:
  - {name: store_name,   entity: store,  column: name,     type: categorical, synonyms: [门店, 药店]}
  - {name: city,         entity: store,  column: city,     type: categorical, synonyms: [城市, 区域]}
  - {name: category,     entity: drug,   column: category, type: categorical, synonyms: [品类, 类别, 药品分类]}
  - {name: member_tier,  entity: member, column: tier,     type: categorical, synonyms: [会员等级, 等级]}
  - {name: member_phone, entity: member, column: phone,    type: categorical, mask: "'***'"}  # PII
  - {name: sold_time,    entity: sale,   column: sold_at,  type: time}

metrics:
  - {name: units_sold, entity: sale, agg: sum, expr: "qty"}
  - name: revenue
    description: "Total sales amount (RMB)."
    synonyms: [销售额, 营收, sales]
    entity: sale
    agg: sum
    expr: "amount"
    roles: [finance, admin]
  - name: gross_margin
    description: "Revenue minus cost of goods sold."
    synonyms: [毛利, 毛利额]
    entity: sale
    agg: sum
    expr: "(amount - cost_amount)"
    roles: [finance, admin]
  - name: rx_units
    description: "Units sold that are prescription drugs (处方药)."
    synonyms: [处方销量, 处方件数]
    entity: sale
    agg: sum
    expr: "case when sale.is_rx then qty else 0 end"
  - {name: stock_on_hand, entity: inventory, agg: sum, expr: "qty"}
  - name: near_expiry_stock
    description: "On-hand units expiring within 90 days (近效期库存, risk)."
    synonyms: [近效期库存, 临期库存]
    entity: inventory
    agg: sum
    expr: "case when expiry < current_date + interval '90 days' then qty else 0 end"

  - name: margin_rate
    description: "Gross margin as a share of revenue."
    synonyms: [毛利率]
    formula: "gross_margin::numeric / nullif(revenue, 0)"
    additivity: non_additive
    roles: [finance, admin]
  - name: rx_ratio
    description: "Prescription units as a share of all units sold."
    synonyms: [处方占比, 处方比例]
    formula: "rx_units::numeric / nullif(units_sold, 0)"
    additivity: non_additive
  - name: sell_through
    description: "Units sold as a share of (units sold + on-hand). Sales grain vs inventory grain."
    synonyms: [动销率, sell-through]
    formula: "units_sold::numeric / nullif(units_sold + stock_on_hand, 0)"
    additivity: non_additive
