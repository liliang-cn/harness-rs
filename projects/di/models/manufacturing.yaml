# Semantic model for a manufacturing quality operation. Production grain (work
# orders) vs inspection grain vs defect grain (defects fan out per inspection):
# defect_rate is the chasm — each base metric aggregates in its own CTE.
# revenue / cost / gross_margin are finance-gated; operator phone is masked.

entities:
  - {name: plant,      table: plants,      primary_key: plant_id}
  - {name: line,       table: lines,       primary_key: line_id}
  - {name: product,    table: products,    primary_key: product_id}
  - {name: work_order, table: work_orders, primary_key: wo_id}
  - {name: inspection, table: inspections, primary_key: insp_id}
  - {name: defect,     table: defects,     primary_key: defect_id}
  - {name: downtime,   table: downtime,    primary_key: down_id}

joins:
  - {from: line,       to: plant,      from_key: plant_id,   to_key: plant_id,   cardinality: many_to_one}
  - {from: work_order, to: plant,      from_key: plant_id,   to_key: plant_id,   cardinality: many_to_one}
  - {from: work_order, to: line,       from_key: line_id,    to_key: line_id,    cardinality: many_to_one}
  - {from: work_order, to: product,    from_key: product_id, to_key: product_id, cardinality: many_to_one}
  - {from: inspection, to: plant,      from_key: plant_id,   to_key: plant_id,   cardinality: many_to_one}
  - {from: inspection, to: line,       from_key: line_id,    to_key: line_id,    cardinality: many_to_one}
  - {from: inspection, to: work_order, from_key: wo_id,      to_key: wo_id,      cardinality: many_to_one}
  - {from: defect,     to: inspection, from_key: insp_id,    to_key: insp_id,    cardinality: many_to_one}
  - {from: defect,     to: plant,      from_key: plant_id,   to_key: plant_id,   cardinality: many_to_one}
  - {from: defect,     to: line,       from_key: line_id,    to_key: line_id,    cardinality: many_to_one}
  - {from: downtime,   to: plant,      from_key: plant_id,   to_key: plant_id,   cardinality: many_to_one}
  - {from: downtime,   to: line,       from_key: line_id,    to_key: line_id,    cardinality: many_to_one}

dimensions:
  - {name: plant_name,     entity: plant,      column: name,     type: categorical, synonyms: [工厂, 基地, 厂]}
  - {name: region,         entity: plant,      column: region,   type: categorical, synonyms: [大区, 区域]}  # RLS key
  - {name: line_name,      entity: line,       column: name,     type: categorical, synonyms: [产线, 生产线, 线体]}
  - {name: product_category, entity: product,  column: category, type: categorical, synonyms: [品类, 产品类别, 型号类别]}
  - {name: defect_type,    entity: defect,     column: defect_type, type: categorical, synonyms: [缺陷类型, 不良类型]}
  - {name: severity,       entity: defect,     column: severity, type: categorical, synonyms: [严重度, 缺陷等级]}
  - {name: wo_status,      entity: work_order, column: status,   type: categorical, synonyms: [工单状态]}
  - {name: operator_phone, entity: work_order, column: operator_phone, type: categorical, mask: "'***'"}  # PII
  - {name: start_time,     entity: work_order, column: started_at,  type: time}

metrics:
  - name: produced_qty
    description: "Units produced (production grain)."
    synonyms: [产量, 生产数量, 产出]
    entity: work_order
    agg: sum
    expr: "produced_qty"
  - name: scrapped_qty
    description: "Units scrapped (production grain)."
    synonyms: [废品数, 报废数]
    entity: work_order
    agg: sum
    expr: "scrapped_qty"
  - name: inspected_qty
    description: "Units inspected (inspection grain)."
    synonyms: [检验数量, 受检数]
    entity: inspection
    agg: sum
    expr: "inspected_qty"
  - name: passed_qty
    description: "Units passing first inspection (inspection grain)."
    synonyms: [一次合格数, 检验合格数]
    entity: inspection
    agg: sum
    expr: "passed_qty"
  - name: defects_qty
    description: "Defect count (defect grain, fans out per inspection)."
    synonyms: [缺陷数, 不良数]
    entity: defect
    agg: sum
    expr: "qty"
  - name: downtime_minutes
    description: "Line downtime minutes."
    synonyms: [停机时长, 停机分钟]
    entity: downtime
    agg: sum
    expr: "minutes"
  - name: revenue
    description: "Work-order revenue on good units (RMB)."
    synonyms: [营收, 产值, 销售额]
    entity: work_order
    agg: sum
    expr: "revenue_amount"
    roles: [finance, admin]
  - name: cost
    description: "Production cost (RMB)."
    synonyms: [成本, 制造成本]
    entity: work_order
    agg: sum
    expr: "cost_amount"
    roles: [finance, admin]

  - name: scrap_rate
    description: "Scrapped over produced (production grain)."
    synonyms: [废品率, 报废率]
    formula: "scrapped_qty::numeric / nullif(produced_qty, 0)"
    additivity: non_additive
  - name: first_pass_yield
    description: "Passed over inspected (inspection grain). FPY."
    synonyms: [一次合格率, FPY, 直通率]
    formula: "passed_qty::numeric / nullif(inspected_qty, 0)"
    additivity: non_additive
  - name: defect_rate
    description: "Defects over inspected units. Defect grain vs inspection grain."
    synonyms: [缺陷率, 不良率, PPM]
    formula: "defects_qty::numeric / nullif(inspected_qty, 0)"
    additivity: non_additive
  - name: gross_margin
    description: "(revenue - cost) / revenue."
    synonyms: [毛利率, 毛利]
    formula: "(revenue - cost)::numeric / nullif(revenue, 0)"
    additivity: non_additive
    roles: [finance, admin]
