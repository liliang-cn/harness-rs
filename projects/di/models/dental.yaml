# Semantic model for a dental clinic chain. appointment grain vs treatment grain
# vs chair-capacity grain, so chair_utilization is chasm-safe (each aggregate in
# its own CTE). revenue / gross_margin are finance-gated; patient phone is masked.

entities:
  - {name: clinic,      table: clinics,        primary_key: clinic_id}
  - {name: dentist,     table: dentists,       primary_key: dentist_id}
  - {name: patient,     table: patients,       primary_key: patient_id}
  - {name: appointment, table: appointments,   primary_key: appt_id}
  - {name: treatment,   table: treatments,     primary_key: treatment_id}
  - {name: capacity,    table: chair_capacity, primary_key: cap_id}

joins:
  - {from: treatment,   to: appointment, from_key: appt_id,    to_key: appt_id,    cardinality: many_to_one}
  - {from: appointment, to: clinic,      from_key: clinic_id,  to_key: clinic_id,  cardinality: many_to_one}
  - {from: appointment, to: dentist,     from_key: dentist_id, to_key: dentist_id, cardinality: many_to_one}
  - {from: appointment, to: patient,     from_key: patient_id, to_key: patient_id, cardinality: many_to_one}
  - {from: dentist,     to: clinic,      from_key: clinic_id,  to_key: clinic_id,  cardinality: many_to_one}
  - {from: capacity,    to: clinic,      from_key: clinic_id,  to_key: clinic_id,  cardinality: many_to_one}

dimensions:
  - {name: clinic_name,    entity: clinic,      column: name,         type: categorical, synonyms: [门诊, 门店, 诊所]}
  - {name: city,           entity: clinic,      column: city,         type: categorical, synonyms: [城市, 地区]}
  - {name: category,       entity: treatment,   column: category,     type: categorical, synonyms: [项目类别, 诊疗类别, 品类]}
  - {name: appt_status,    entity: appointment, column: status,       type: categorical, synonyms: [预约状态, 状态]}
  - {name: patient_phone,  entity: patient,     column: phone,        type: categorical, mask: "'***'"}  # PII
  - {name: scheduled_time, entity: appointment, column: scheduled_at, type: time}

metrics:
  - name: revenue
    description: "Total treatment amount billed (RMB)."
    synonyms: [营收, 收入, 诊疗收入]
    entity: treatment
    agg: sum
    expr: "amount"
    roles: [finance, admin]
  - name: gross_margin
    description: "Revenue minus treatment cost."
    synonyms: [毛利, 毛利额]
    entity: treatment
    agg: sum
    expr: "(amount - cost_amount)"
    roles: [finance, admin]
  - {name: treatment_count, entity: treatment,   agg: count, expr: "treatment_id", synonyms: [诊疗项目数, 项目数]}
  - {name: appointments,    entity: appointment, agg: count, expr: "appt_id",       synonyms: [预约数, 预约量]}
  - {name: attended,        entity: appointment, agg: sum,   expr: "(status = 'attended')::int", synonyms: [到诊数]}
  - {name: no_show,         entity: appointment, agg: sum,   expr: "(status = 'no_show')::int",  synonyms: [爽约数, 失约数]}
  - {name: chair_used_min,      entity: treatment, agg: sum, expr: "actual_min",   synonyms: [椅位占用分钟, 已用椅位分钟]}
  - {name: chair_available_min, entity: capacity,  agg: sum, expr: "available_min", synonyms: [椅位可售分钟, 可用椅位分钟]}

  - name: margin_rate
    description: "Gross margin as a share of revenue."
    synonyms: [毛利率]
    formula: "gross_margin::numeric / nullif(revenue, 0)"
    additivity: non_additive
    roles: [finance, admin]
  - name: attendance_rate
    description: "Attended appointments as a share of all appointments."
    synonyms: [到诊率, 履约率]
    formula: "attended::numeric / nullif(appointments, 0)"
    additivity: non_additive
  - name: chair_utilization
    description: "Used chair-minutes as a share of sellable chair-minutes. Treatment grain vs capacity grain."
    synonyms: [椅位利用率, 椅位使用率]
    formula: "chair_used_min::numeric / nullif(chair_available_min, 0)"
    additivity: non_additive
