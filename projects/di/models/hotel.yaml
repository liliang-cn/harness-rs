# Semantic model for a hotel & B&B chain. stay grain vs capacity grain, so
# occupancy / revpar are the classic chasm: each base metric must aggregate in
# its own CTE. revenue / revpar / adr are finance-gated; guest phone is masked.

entities:
  - {name: hotel,    table: hotels,        primary_key: hotel_id}
  - {name: room,     table: rooms,         primary_key: room_id}
  - {name: guest,    table: guests,        primary_key: guest_id}
  - {name: capacity, table: room_capacity, primary_key: cap_id}
  - {name: stay,     table: stays,         primary_key: stay_id}

joins:
  - {from: stay,     to: hotel, from_key: hotel_id, to_key: hotel_id, cardinality: many_to_one}
  - {from: stay,     to: room,  from_key: room_id,  to_key: room_id,  cardinality: many_to_one}
  - {from: stay,     to: guest, from_key: guest_id, to_key: guest_id, cardinality: many_to_one}
  - {from: room,     to: hotel, from_key: hotel_id, to_key: hotel_id, cardinality: many_to_one}
  - {from: capacity, to: hotel, from_key: hotel_id, to_key: hotel_id, cardinality: many_to_one}

dimensions:
  - {name: hotel_name,   entity: hotel, column: name,     type: categorical, synonyms: [酒店, 门店, 民宿]}
  - {name: city,         entity: hotel, column: city,     type: categorical, synonyms: [城市, 地区]}
  - {name: room_type,    entity: room,  column: room_type, type: categorical, synonyms: [房型, 房间类型]}
  - {name: stay_status,  entity: stay,  column: status,   type: categorical, synonyms: [订单状态, 入住状态]}
  - {name: guest_phone,  entity: guest, column: phone,    type: categorical, mask: "'***'"}  # PII
  - {name: checkin_time, entity: stay,  column: checkin,  type: time}

metrics:
  - name: room_nights_sold
    description: "Sold room-nights (checked-out stays only)."
    synonyms: [间夜数, 已售间夜, 售出间夜]
    entity: stay
    agg: sum
    expr: "case when status='checked_out' then room_nights else 0 end"
  - name: revenue
    description: "Total stay revenue, checked-out only (RMB)."
    synonyms: [营收, 客房收入, 销售额]
    entity: stay
    agg: sum
    expr: "case when status='checked_out' then amount else 0 end"
    roles: [finance, admin]
  - name: available_room_nights
    description: "Sellable room-nights (capacity grain)."
    synonyms: [可售间夜, 可用间夜]
    entity: capacity
    agg: sum
    expr: "available_room_nights"
  - {name: stays_count, entity: stay, agg: count, expr: "stay_id"}

  - name: occupancy
    description: "Sold room-nights over available room-nights. Stay grain vs capacity grain."
    synonyms: [入住率, 出租率]
    formula: "room_nights_sold::numeric / nullif(available_room_nights, 0)"
    additivity: non_additive
  - name: revpar
    description: "Revenue per available room-night. Revenue grain vs capacity grain."
    synonyms: [RevPAR, 每可售房收入, 单房收益]
    formula: "revenue::numeric / nullif(available_room_nights, 0)"
    additivity: non_additive
    roles: [finance, admin]
  - name: adr
    description: "Average daily rate: revenue per sold room-night."
    synonyms: [平均房价, ADR, 平均房单价]
    formula: "revenue::numeric / nullif(room_nights_sold, 0)"
    additivity: non_additive
    roles: [finance, admin]
