# Semantic model for E-Commerce BI (综合电商平台经营分析).
entities:
  - {name: product,     table: products,    primary_key: sku}
  - {name: customer,    table: customers,   primary_key: customer_id}
  - {name: order,       table: orders,      primary_key: order_id}
  - {name: order_item,  table: order_items, primary_key: item_id}
  - {name: review,      table: reviews,     primary_key: review_id}

joins:
  - {from: order_item, to: order,      from_key: order_id,    to_key: order_id,    cardinality: many_to_one}
  - {from: order_item, to: product,    from_key: sku,         to_key: sku,         cardinality: many_to_one}
  - {from: order,      to: customer,   from_key: customer_id, to_key: customer_id, cardinality: many_to_one}
  - {from: review,     to: product,    from_key: sku,         to_key: sku,         cardinality: many_to_one}
  - {from: review,     to: customer,   from_key: customer_id, to_key: customer_id, cardinality: many_to_one}

dimensions:
  - {name: category,          entity: product,  column: category,  type: categorical, synonyms: [品类, 类目, 类别]}
  - {name: brand,             entity: product,  column: brand,     type: categorical, synonyms: [品牌, 牌子]}
  - {name: product_name,      entity: product,  column: name,      type: categorical, synonyms: [商品名, 商品名称]}
  - {name: channel,           entity: order,    column: channel,   type: categorical, synonyms: [渠道, 平台, 销售渠道]}
  - {name: order_status,      entity: order,    column: status,    type: categorical, synonyms: [订单状态, 状态]}
  - {name: customer_city,     entity: customer, column: city,      type: categorical, synonyms: [城市]}
  - {name: customer_province, entity: customer, column: province,  type: categorical, synonyms: [省份, 区域, 地区]}
  - {name: customer_tier,     entity: customer, column: tier,      type: categorical, synonyms: [会员等级, 会员类型]}
  - {name: ordered_time,      entity: order,    column: ordered_at, type: time}

metrics:
  - name: units_sold
    description: "Total units sold across order items."
    synonyms: [销量, 销售件数, 售出数量]
    entity: order_item
    agg: sum
    expr: "qty"

  - name: transactions
    description: "Number of order items / orders."
    synonyms: [订单数, 单量, 成交笔数]
    entity: order_item
    agg: count
    expr: "item_id"

  - name: revenue
    description: "Total sales amount (RMB/GMV)."
    synonyms: [销售额, 营收, 营业额, GMV]
    entity: order_item
    agg: sum
    expr: "amount"
    roles: [finance, admin]

  - name: gross_margin
    description: "Total sales minus cost of goods sold."
    synonyms: [毛利, 毛利额, 净利润]
    entity: order_item
    agg: sum
    expr: "(amount - cost_amount)"
    roles: [finance, admin]

  - name: stock_on_hand
    description: "Current on-hand inventory units."
    synonyms: [库存, 在库量, 库存量]
    entity: product
    agg: sum
    expr: "stock_qty"

  - name: avg_rating
    description: "Average customer review rating (1 to 5 stars)."
    synonyms: [平均评分, 评分, 好评度, 口碑]
    entity: review
    agg: avg
    expr: "rating"

  - name: review_count
    description: "Total number of product reviews."
    synonyms: [评价数, 评论数]
    entity: review
    agg: count
    expr: "review_id"

  - name: margin_rate
    description: "Gross margin as a percentage of revenue."
    synonyms: [毛利率, 利润率]
    formula: "gross_margin::numeric / nullif(revenue, 0)"
    additivity: non_additive
    roles: [finance, admin]

  - name: avg_order_value
    description: "Average revenue per order item."
    synonyms: [客单价, 平均订单金额]
    formula: "revenue::numeric / nullif(transactions, 0)"
    additivity: non_additive
    roles: [finance, admin]

  - name: sell_through
    description: "Units sold as a share of (units sold + stock on hand)."
    synonyms: [动销率, 售罄率]
    formula: "units_sold::numeric / nullif(units_sold + stock_on_hand, 0)"
    additivity: non_additive
