# di-server 自成 workspace:依赖 crates.io 上发布的 harness-rs-*,不吃父目录的
# path 依赖。这样整个 projects/di 目录可以原样搬到别的仓库里,不需要带上框架。
[workspace]
resolver = "3"
members = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liliang-cn/harness-rs"
authors = ["liliang"]

[workspace.dependencies]
# 框架用发布版。`harness` 这个名字在 crates.io 上被一个无关的 benchmark crate
# 占了,发布名是 harness-rs-*;这里用 package= 保持源码里的 `use harness_core::…`。
harness-core       = { package = "harness-rs-core",       version = "0.0.31" }
harness-serve      = { package = "harness-rs-serve",      version = "0.0.31" }
harness-mcp-client = { package = "harness-rs-mcp-client", version = "0.0.31" }
harness-hooks      = { package = "harness-rs-hooks",      version = "0.0.31" }
harness-models     = { package = "harness-rs-models",     version = "0.0.31" }

tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
async-trait = "0.1"
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# 要在框架里改一处并立刻验证时,取消注释即可让本地源码顶掉发布版。
# 提交前改回来,否则这个目录就又搬不走了。
# [patch.crates-io]
# harness-rs-serve = { path = "../../crates/harness-serve" }

[package]
name = "di-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "di_server"
path = "src/lib.rs"

[[bin]]
name = "di-server"
path = "src/main.rs"

[dependencies]
harness-core   = { workspace = true }
harness-serve  = { workspace = true, features = ["http", "cors"] }
harness-mcp-client = { workspace = true }
harness-hooks  = { workspace = true }
harness-models = { workspace = true }
tokio          = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs"] }
axum           = "0.8"
tower-http     = { version = "0.6", features = ["fs", "cors"] }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sqlx           = { version = "0.8", default-features = false, features = ["postgres", "mysql", "sqlite", "runtime-tokio-rustls", "json", "chrono", "rust_decimal"] }
anyhow         = { workspace = true }
include_dir    = "0.7"
chrono         = { workspace = true }
rust_decimal   = "1"
