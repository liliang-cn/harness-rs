[package]
name = "boss-briefing"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Industry intelligence and executive briefing generator built with harness-rs"

[workspace]

[[bin]]
name = "boss-briefing"
path = "src/main.rs"

[dependencies]
harness-core = { package = "harness-rs-core", path = "../../crates/harness-core" }
harness-models = { package = "harness-rs-models", path = "../../crates/harness-models" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
url = "2"
