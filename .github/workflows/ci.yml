name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.92)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: Test harness-mcp-client (test-server feature)
        run: cargo test -p harness-rs-mcp-client --features test-server

      # `otel` is not a default feature either: without this step nothing
      # checks that the trace survives the trip into OpenTelemetry.
      - name: Test harness-loop (otel feature)
        run: cargo test -p harness-rs-loop --features otel

      - name: Test harness-serve (prometheus + otel features)
        run: cargo test -p harness-rs-serve --features prometheus,otel

      # The `grpc` feature's build script compiles CortexDB's protos with
      # prost-build, which shells out to `protoc`. Neither runner image ships
      # it, so this has to be installed before the step below.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `grpc` is not a default feature, so the workspace run above never
      # compiles that backend — which is how it kept a TTL bug the MCP path
      # had already fixed. A backend nobody builds is a backend nobody tests.
      - name: Test harness-cortexdb (grpc feature)
        run: cargo test -p harness-rs-cortexdb --features grpc

  # A public repo once carried a live API key in scratch launch scripts, swept
  # in by `git add -A` together with node_modules and a .dmg. This keeps the
  # tracked tree to real source: no dependency trees, no scratch scripts or
  # screenshots outside the directories that hold real ones, no live keys.
  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No dependencies, scratch scripts, scratch images or keys in git
        run: |
          bad=$( {
            git ls-files | grep -E '(^|/)node_modules/|(^|/)__pycache__/|\.dmg$|^(test_|start_|fix_)[^/]*$'
            git ls-files | grep -iE '\.(py|js|mjs|cjs|ts|sh)$' | grep -vE '^(examples/[^/]+/|skills/|deploy/)'
            git ls-files | grep -iE '\.(png|jpe?g|gif|webp|bmp|heic|tiff?)$' | grep -vE '^(assets|docs)/'
          } || true )
          if [ -n "$bad" ]; then echo "::error::files that do not belong in git:"; echo "$bad"; exit 1; fi
          if git grep -lE 'sk-cpa-[A-Za-z0-9]|sk-an[t]-api[0-9]|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}'; then
            echo "::error::a file above looks like it carries a live key"; exit 1
          fi

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy harness-mcp-client (test-server feature)
        run: cargo clippy -p harness-rs-mcp-client --all-targets --features test-server -- -D warnings
      - name: Clippy observability features (otel, prometheus)
        run: cargo clippy -p harness-rs-loop -p harness-rs-serve -p harness-rs-cli --all-targets --features harness-rs-loop/otel,harness-rs-serve/otel,harness-rs-serve/prometheus,harness-rs-cli/otel -- -D warnings
