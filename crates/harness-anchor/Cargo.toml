[package]
name = "harness-rs-anchor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Anchor a semantic model against a figure the customer already publishes: search the scopes of a metric for the one that reproduces it. Turns SELF-CONSISTENT into VERIFIED."

keywords   = ["bi", "verification", "semantic-layer", "metrics", "harness"]
categories = ["database", "development-tools"]

[lib]
name = "harness_anchor"
path = "src/lib.rs"

[dependencies]
harness-rs-semantic = { path = "../harness-semantic" }
serde     = { workspace = true }
thiserror = { workspace = true }
