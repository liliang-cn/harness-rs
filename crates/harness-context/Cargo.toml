[package]
name = "harness-rs-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Default World runtime (Tokio process runner, system clock, in-memory KV) and Context helpers for harness-rs."

keywords     = ["agent", "ai", "llm", "harness"]
categories   = ["asynchronous", "development-tools"]
readme       = "../../README.md"
[lib]
name = "harness_context"
path = "src/lib.rs"

[dependencies]
inventory   = { workspace = true }
once_cell   = { workspace = true }
serde_yaml  = { workspace = true }
walkdir     = { workspace = true }
harness-core = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }
regex        = { workspace = true }
thiserror    = { workspace = true }

# Per-turn cost measurement. `harness = false` because the workspace has no
# criterion dependency and `#[bench]` needs nightly — this is a plain
# wall-clock binary. See docs/per-turn-cost.md.
[[bench]]
name = "user_model"
harness = false

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
harness-core = { workspace = true }
