[package]
name = "harness-rs-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP client for harness-rs: expose a remote MCP server's tools as harness tools"

keywords     = ["mcp", "agent", "ai", "llm", "tools"]
categories   = ["asynchronous", "development-tools"]
readme       = "README.md"

[lib]
name = "harness_mcp_client"
path = "src/lib.rs"

[[bin]]
name = "mcp-echo-server"
path = "src/bin/mcp-echo-server.rs"
required-features = ["test-server"]

[features]
default = ["http", "tls-rustls"]
http = ["rmcp/transport-streamable-http-client", "rmcp/transport-streamable-http-client-reqwest", "dep:reqwest"]
# TLS for the HTTP transport. WITHOUT one of these, reqwest has no TLS backend
# and every `https://` MCP server fails at the connector with the baffling
# `invalid URL, scheme is not http` — before a socket is ever opened. Since
# practically every remote MCP server is https, rustls is on by default.
# For a system-trust-store build: default-features = false, then
# features = ["http", "tls-native"].
tls-rustls = ["rmcp/reqwest"]
tls-native = ["rmcp/reqwest-native-tls"]
test-server = ["dep:harness-mcp", "dep:harness-context"]

[dependencies]
harness-core = { workspace = true }
harness-mcp = { workspace = true, optional = true }
harness-context = { workspace = true, optional = true }
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-io"] }
# Optional, only under `http`: lets callers inject a hardened reqwest client
# (redirect policy + pinned DNS) for SSRF-safe connects. MUST match the reqwest
# version rmcp 1.7 links (0.13) so the `reqwest::Client` type unifies and rmcp's
# `impl StreamableHttpClient for reqwest::Client` applies. The TLS backend is
# NOT selected here but through the `tls-*` features above, which go via rmcp's
# own `reqwest`/`reqwest-native-tls` knobs — rmcp owns the dependency, so letting
# it choose keeps the two in step. Re-exported as `crate::reqwest`.
reqwest = { version = "0.13", optional = true, default-features = false }
async-trait = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync", "time"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
harness-loop = { workspace = true }
harness-models = { workspace = true }
