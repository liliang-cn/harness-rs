[package]
name = "harness-rs-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multi-session serving core for harness-rs agents: pluggable auth, session store, per-request identity, and wired audit trail. Optional axum HTTP layer."

keywords     = ["agent", "ai", "llm", "harness"]
categories   = ["asynchronous", "web-programming"]
readme       = "README.md"

[lib]
name = "harness_serve"
path = "src/lib.rs"

[dependencies]
harness-core    = { workspace = true }
harness-loop    = { workspace = true }
harness-models  = { workspace = true }
harness-context = { workspace = true }
async-trait     = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tracing         = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
futures         = { workspace = true }

# Optional HTTP transport.
axum = { version = "0.8", optional = true }
# Optional CORS layer for the HTTP transport (feature `cors`).
tower-http = { version = "0.6", features = ["cors"], optional = true }
# Optional Prometheus exporter for the loop's metrics (feature `prometheus`).
# Without the default http-listener: `/metrics` is served by our own axum router.
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
# Optional gRPC transport.
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

[build-dependencies]
# Only compiled when the `grpc` feature is enabled (see build.rs).
tonic-build = { version = "0.12", optional = true }

[features]
default = []
# Expose `http::router()` — an axum Router with /chat, /chat/stream (SSE), /healthz.
http = ["dep:axum"]
# Expose `http::router_with_cors()` + `CorsConfig` so a browser/aigui page served
# from another origin can call /chat and read the /chat/stream SSE.
cors = ["http", "dep:tower-http"]
# Expose `grpc::service()` — a tonic Chat service (unary Say + server-streaming
# SayStream). Requires `protoc` at build time.
grpc = ["dep:tonic", "dep:prost", "dep:tonic-build"]
# Re-enable `harness-rs-loop/otel`, so a server binary can ship its traces over
# OTLP with `harness_loop::otel::init_tracing_with_otlp` without depending on
# the loop crate just to flip a feature.
otel = ["harness-loop/otel"]
# Expose `prometheus::install()` + `prometheus::router()` — the loop's metrics
# (`harness_loop::meters`) as `GET /metrics` in the Prometheus text format.
prometheus = ["http", "dep:metrics-exporter-prometheus"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
metrics = "0.24"
tower = { version = "0.5", features = ["util"] }
