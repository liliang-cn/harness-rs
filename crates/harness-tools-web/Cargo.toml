[package]
name = "harness-rs-tools-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Web-search + URL-fetch tools for harness-rs agents. GroundedWebSearch asks the model's own search engine first (Gemini grounding) and falls back to the DuckDuckGo-then-Bing scraper; HTML-to-text fetch. No API keys required for the scraper path."

[dependencies]
harness         = { workspace = true }
harness-core    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
tracing         = { workspace = true }
tokio           = { workspace = true }
reqwest         = { workspace = true }
scraper         = "0.20"
urlencoding     = "2"

[dev-dependencies]
harness-context = { workspace = true }
