[workspace]
resolver = "3"
members = [
    "crates/harness",
    "crates/harness-core",
    "crates/harness-macros",
    "crates/harness-context",
    "crates/harness-loop",
    "crates/harness-serve",
    "crates/harness-cortexdb",
    "crates/harness-tools-docs",
    "crates/harness-tools-web",
    "crates/harness-tools",
    "crates/harness-tools-sql",
    "crates/harness-models",
    "crates/harness-mcp-client",
    "crates/harness-recall-sqlite",
    "crates/harness-cli",
    "examples/crate-keeper",
    "examples/loop-engine-demo",
    "examples/orchestrator-demo",
    "examples/ecommerce-analyst",
    "examples/ecommerce-ops-agent",
    "examples/cortexdb-memory",
    "examples/experience-cortexdb",
    "examples/deepseek-hello",
    "examples/personal-assistant",
    "examples/investor-bot",
    "examples/ai-note",
    "examples/deepseek-caps-e2e",
    "examples/eval-bench",
    "examples/cap",
    "examples/redaction-demo",
]

[workspace.package]
version = "0.0.61"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/liliang-cn/harness-rs"
authors = ["liliang"]

[workspace.dependencies]
# 语义层与它周边的几个 crate。用 workspace 依赖登记一次,各 crate 写
# `{ workspace = true }` 即可 —— 版本与路径只有一处需要改。
# internal — alias keys keep the in-source `use harness_core::*` style;
# `package = ...` selects the on-crates.io name (`harness` is taken by an
# unrelated benchmarking crate, so we publish as `harness-rs-*`).
harness            = { package = "harness-rs",            path = "crates/harness",            version = "0.0.61" }
harness-core       = { package = "harness-rs-core",       path = "crates/harness-core",       version = "0.0.61" }
harness-macros     = { package = "harness-rs-macros",     path = "crates/harness-macros",     version = "0.0.61" }
harness-context    = { package = "harness-rs-context",    path = "crates/harness-context",    version = "0.0.61" }
harness-loop       = { package = "harness-rs-loop",       path = "crates/harness-loop",       version = "0.0.61" }
harness-serve      = { package = "harness-rs-serve",      path = "crates/harness-serve",      version = "0.0.61" }
harness-cortexdb   = { package = "harness-rs-cortexdb",     path = "crates/harness-cortexdb",     version = "0.0.61" }
harness-mcp-client = { package = "harness-rs-mcp-client",   path = "crates/harness-mcp-client",   version = "0.0.61" }
harness-tools      = { package = "harness-rs-tools",      path = "crates/harness-tools",      version = "0.0.61" }
harness-tools-docs = { package = "harness-rs-tools-docs", path = "crates/harness-tools-docs", version = "0.0.61" }
harness-tools-web  = { package = "harness-rs-tools-web",  path = "crates/harness-tools-web",  version = "0.0.61" }
harness-tools-sql  = { package = "harness-rs-tools-sql",  path = "crates/harness-tools-sql",  version = "0.0.61" }
harness-recall-sqlite= { package = "harness-rs-recall-sqlite",path = "crates/harness-recall-sqlite",version = "0.0.61" }
harness-models     = { package = "harness-rs-models",     path = "crates/harness-models",     version = "0.0.61" }
harness-cli        = { package = "harness-rs-cli",        path = "crates/harness-cli",        version = "0.0.61" }

# external
async-trait = "0.1"
thiserror   = "2"
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
libc        = "0.2"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "sync", "time"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inventory   = "0.3"
regex       = "1"
futures     = "0.3"
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full", "extra-traits"] }
walkdir     = "2"
clap        = { version = "4", features = ["derive"] }
once_cell   = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono      = { version = "0.4", features = ["serde"] }
schemars    = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
